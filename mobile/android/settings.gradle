pluginManagement {
    def pluginDir = new File(rootDir, "../node_modules/@react-native/gradle-plugin")
    if (!pluginDir.exists()) {
        pluginDir = new File(rootDir, "../../node_modules/@react-native/gradle-plugin")
    }
    if (!pluginDir.exists()) {
        pluginDir = new File(["node", "--print", "require.resolve('@react-native/gradle-plugin/package.json')"].execute(null, rootDir.parentFile).text.trim()).getParentFile()
    }
    includeBuild(pluginDir.toString())
}
plugins { id("com.facebook.react.settings") }
extensions.configure(com.facebook.react.ReactSettingsExtension) { ex -> ex.autolinkLibrariesFromCommand() }
rootProject.name = 'JcbCmms'
include ':app'

